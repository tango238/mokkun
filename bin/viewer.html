<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mokkun</title>
  <link rel="stylesheet" href="/mokkun.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background-color: #f5f6f7;
    }

    .page-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #1a1a2e;
      color: #fff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .toolbar h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .toolbar-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar label {
      font-size: 14px;
      color: #a0a0a0;
    }

    .toolbar select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #3a3a5a;
      background: #2a2a4a;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      min-width: 180px;
    }

    .toolbar select:hover { border-color: #5a5a8a; }
    .toolbar select:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .toolbar-spacer { flex: 1; }
    .toolbar-section[hidden] { display: none; }
    .toolbar select { min-width: 120px; }
    .toolbar select option:disabled { color: #8a8aa8; }

    #mokkun-app {
      margin-top: 60px;
      flex: 1;
      padding: 24px;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 50vh;
      font-size: 18px;
      color: #666;
    }

    .error-message {
      background: #fee2e2;
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 16px 24px;
      margin: 24px;
      color: #b91c1c;
    }

    body.dark-theme { background-color: #1a1a2e; }
    body.dark-theme .toolbar { background: #0f0f1a; }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="toolbar">
      <h1>Mokkun</h1>

      <div class="toolbar-section">
        <label for="screen-select">Screen:</label>
        <select id="screen-select">
          <option value="">Loading...</option>
        </select>
      </div>

      <!-- v2 文書のときだけ表示: 状態（通常 / 成功 / エラー / 空 / 読み込み中）とロール -->
      <div class="toolbar-section" id="state-section" hidden>
        <label for="state-select">状態:</label>
        <select id="state-select"></select>
      </div>
      <div class="toolbar-section" id="role-section" hidden>
        <label for="role-select">ロール:</label>
        <select id="role-select"></select>
      </div>

      <div class="toolbar-spacer"></div>
    </div>

    <div id="mokkun-app">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <script src="/mokkun.js"></script>
  <script>
    (function() {
      var mokkunInstance = null;
      var screenSelect = document.getElementById('screen-select');

      // Theme injected by CLI (default: light)
      var currentTheme = /* __THEME__ */ 'light';

      // YAML URL injected by CLI (or null for sample)
      var yamlUrl = /* __YAML_URL__ */ null;

      // Apply theme
      document.body.classList.toggle('dark-theme', currentTheme === 'dark');
      document.documentElement.setAttribute('data-theme', currentTheme);

      var stateSelect = document.getElementById('state-select');
      var roleSelect = document.getElementById('role-select');
      var params = new URLSearchParams(window.location.search);
      var STATE_LABELS = { normal: '通常', success: '成功', error: 'エラー', empty: '空', loading: '読み込み中' };

      // 状態セレクト: 現在の画面が持つ states.* に対応するものだけ選べる
      function refreshStateSelect() {
        var section = document.getElementById('state-section');
        if (!mokkunInstance || !mokkunInstance.schemaV2) { section.hidden = true; return; }
        section.hidden = false;
        var enabled = mokkunInstance.getAvailableStates();
        stateSelect.innerHTML = '';
        Object.keys(STATE_LABELS).forEach(function(key) {
          var opt = document.createElement('option');
          opt.value = key;
          opt.textContent = STATE_LABELS[key];
          opt.disabled = enabled.indexOf(key) < 0;
          stateSelect.appendChild(opt);
        });
        stateSelect.value = mokkunInstance.viewState;
      }

      // ロールセレクト: app.roles（と「すべて」）。roles が無い文書では出さない
      function buildRoleSelect() {
        var section = document.getElementById('role-section');
        var schema = mokkunInstance && mokkunInstance.schemaV2;
        var roles = (schema && schema.app.roles) || [];
        section.hidden = roles.length === 0;
        roleSelect.innerHTML = '';
        [''].concat(roles).forEach(function(role) {
          var opt = document.createElement('option');
          opt.value = role;
          opt.textContent = role || 'すべて';
          roleSelect.appendChild(opt);
        });
        roleSelect.value = mokkunInstance.role || '';
      }

      // Screen change
      screenSelect.addEventListener('change', function() {
        if (mokkunInstance && screenSelect.value) {
          mokkunInstance.showScreen(screenSelect.value);
          refreshStateSelect();
        }
      });
      stateSelect.addEventListener('change', function() {
        if (mokkunInstance) mokkunInstance.setState(stateSelect.value);
      });
      roleSelect.addEventListener('change', function() {
        if (mokkunInstance) mokkunInstance.setRole(roleSelect.value || undefined);
      });

      // Sample YAML for when no file is specified
      var sampleYaml = [
        'view:',
        '  sample:',
        '    title: "Mokkun Sample"',
        '    description: "npx mokkun <yaml-file> to view your own YAML"',
        '    fields:',
        '      - id: name',
        '        type: text',
        '        label: "Name"',
        '        required: true',
        '      - id: email',
        '        type: text',
        '        label: "Email"',
        '        input_type: email',
        '      - id: category',
        '        type: select',
        '        label: "Category"',
        '        options:',
        '          - label: "Select..."',
        '            value: ""',
        '          - label: "Option A"',
        '            value: a',
        '          - label: "Option B"',
        '            value: b',
        '      - id: message',
        '        type: textarea',
        '        label: "Message"',
        '        rows: 4',
        '    actions:',
        '      - id: submit',
        '        type: submit',
        '        label: "Submit"',
        '        style: primary',
      ].join('\n');

      // Initialize
      async function init() {
        var options = {
          container: '#mokkun-app',
          theme: currentTheme,
          initialScreen: params.get('screen') || undefined,
          initialState: params.get('state') || undefined,
          role: params.get('role') || undefined,
          onReady: function(instance) {
            mokkunInstance = instance;
            var screens = instance.getScreenNames();
            screenSelect.innerHTML = '';
            screens.forEach(function(name) {
              var opt = document.createElement('option');
              opt.value = name;
              opt.textContent = name;
              screenSelect.appendChild(opt);
            });
            screenSelect.value = instance.currentScreen || screens[0] || '';
            refreshStateSelect();
            buildRoleSelect();
            // 旧フォーマットへ変換したときに落ちるキーはコンソールにだけ出す（画面には出さない）
            if (instance.schemaV2) {
              Mokkun.utils.compileV2Warnings(instance.schemaV2).forEach(function(w) {
                console.warn('[mokkun] 旧フォーマット変換: ' + w.path + ': ' + w.message);
              });
            }
          },
          onNavigate: function(from, to) {
            screenSelect.value = to;
            refreshStateSelect();
          },
          onError: function(error) {
            document.getElementById('mokkun-app').innerHTML =
              '<div class="error-message"><strong>Error:</strong> ' + error.message + '</div>';
          },
          onSubmit: function(screenName, formData) {
            console.log('Submit:', screenName, formData);
          }
        };

        if (yamlUrl) {
          options.yamlUrl = yamlUrl;
        } else {
          options.yamlContent = sampleYaml;
        }

        try {
          mokkunInstance = await Mokkun.init(options);
        } catch (e) {
          document.getElementById('mokkun-app').innerHTML =
            '<div class="error-message"><strong>Error:</strong> ' + e.message + '</div>';
        }
      }

      init();
    })();
  </script>
</body>
</html>
